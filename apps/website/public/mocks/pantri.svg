  <text x="220" y="118" fill="#6f1f37" font-family="Inter, sans-serif" font-size="18" font-weight="500">This week</text>
  <text x="220" y="164" fill="#211b1c" font-family="Georgia, serif" font-size="40">Shopping</text>
  <line x1="220" y1="196" x2="980" y2="196" stroke="#6f1f37"/>
  <text x="220" y="256" fill="#211b1c" font-family="Inter, sans-serif" font-size="24">Cherry tomatoes</text>
