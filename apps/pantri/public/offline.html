<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#202124" />
    <title>Offline · Pantri</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #202124;
        color: #e8eaed;
        padding: 1.5rem;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #9aa0a6;
        line-height: 1.45;
      }
      button {
        margin-top: 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #e8eaed;
        color: #202124;
        font-weight: 600;
        padding: 0.65rem 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Open Pantri from your home screen (or a shopping/recipes shortcut you’ve used before) to use
        the last synced pantry. Or retry when you have a connection.
      </p>
      <button type="button" onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
